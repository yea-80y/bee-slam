version: "3"

services:
  bee:
    image: ethersphere/bee:stable
    container_name: bee-gateway
    restart: unless-stopped
    environment:
      # Ultra-light node configuration
      - BEE_FULL_NODE=false
      - BEE_SWAP_ENABLE=false

      # API and P2P addresses
      - BEE_API_ADDR=:1633
      - BEE_P2P_ADDR=:1634

      # Password for node encryption
      - BEE_PASSWORD=${BEE_PASSWORD}

      # Verbosity level (5 = debug)
      - BEE_VERBOSITY=info

      # CORS for API access
      - BEE_CORS_ALLOWED_ORIGINS=*
    ports:
      # Expose API on all interfaces for external access
      - "1633:1633"
      # Expose P2P port for network connectivity
      - "1634:1634"
    volumes:
      - bee-data:/home/bee/.bee
    command: start

volumes:
  bee-data:
