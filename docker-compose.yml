services:
  bee:
    image: ethersphere/bee:stable
    container_name: bee-gateway
    restart: unless-stopped
    network_mode: host
    environment:
      # Password for node encryption
      - BEE_PASSWORD=${BEE_PASSWORD}
    # Note: Using host network mode - ports are automatically available on host
    volumes:
      - bee-data:/home/bee/.bee
    command: >
      start
      --api-addr=:1633
      --p2p-addr=:1634
      --verbosity=info
      --cors-allowed-origins=*
      --full-node=false
      --swap-enable=false
      --skip-postage-snapshot
      --mainnet=true

volumes:
  bee-data:
